name: Publish Docker Images

on:
 push:
  branches: [ "**" ]
  tags:
   - "v*"


permissions:
 contents: read
 packages: write

env:
    REGISTRY: ghcr.io

jobs:
 build-and-push:
  runs-on: ubuntu-latest
  timeout-minutes: 60

  strategy:
   matrix:
    include:
    - name: article-service
      dockerfile: ArticleService/Dockerfile
    - name: comment-service
      dockerfile: CommentService/Dockerfile
    - name: publisher-service
      dockerfile: PublisherService/Dockerfile
    - name: newsletter-service
      dockerfile: NewsletterService/Dockerfile
    - name: profanity-service
      dockerfile: ProfanityService/Dockerfile
    - name: draft-service
      dockerfile: DraftService/Dockerfile

  steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    
  - name: Derive names and version
    id: meta
    shell: bash
    run: |
     owner="${GITHUB_REPOSITORY_OWNER,,}"
     repo="${GITHUB_REPOSITORY#*/}"
     repo="${repo,,}"
     raw="${GITHUB_REF_NAME}"
     clean="${raw#v}"
     echo "owner=${owner}" >> "$GITHUB_OUTPUT"
     echo "repo=${repo}" >> "$GITHUB_OUTPUT"
     echo "raw=${raw}" >> "$GITHUB_OUTPUT"
     echo "clean=${clean}" >> "$GITHUB_OUTPUT"

  - name: Set up Docker Build
    uses: docker/setup-buildx-action@v3

  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v3
    with:
     registry: ${{ env.REGISTRY }}
     username: ${{ github.actor }}
     password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build and push ${{ matrix.name }}
    uses: docker/build-push-action@v6
    with:
     context: .
     file: ${{ matrix.dockerfile }}
     push: true
     platforms: linux/amd64
     tags: | 
      ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.repo }}-${{ matrix.name }}:${{ steps.meta.outputs.raw}}
      ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.repo }}-${{ matrix.name }}:${{ steps.meta.outputs.clean }}
      ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.repo }}-${{ matrix.name }}:${{ github.sha }}
      ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.repo }}-${{ matrix.name }}:latest
